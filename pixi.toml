[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
preview = ["pixi-build"]

# sync with rust-toolchain.toml
[workspace.build-variants]
rust_compiler_version = ["1.95.0"]

# See COMPATIBILITY.md
[workspace.target.win.build-variants]
c_compiler = ["vs2022"]
cxx_compiler = ["vs2022"]

[workspace.dependencies]
c-compiler = ">=2.0.0,<3"
rust = "~=1.95.0"
rust-src = "~=1.95.0"
sccache = ">=0.19.0,<0.20"
pixi-build-rust = ">=0.5.7,<0.6"

# ----------- #
# Environment #
# ----------- #

## Features
[feature.build.dependencies]
c-compiler = { workspace = true }
rust = { workspace = true }
rust-src = { workspace = true }

[feature.cache.dependencies]
sccache = { workspace = true }

[feature.cache.tasks]
cache-stat = { cmd = "sccache --show-stats", description = "Show sccache statistics" }

## Environments and tasks
[environments.build]
features = ["build", "cache"]

[tasks]
build = { cmd = "pixi build", description = "Run Build" }

# ----------------- #
# Package definition #
# ----------------- #
[package]
name = "pixi-build-sccache-test"
license = "MIT"

[package.build-dependencies]
sccache = { workspace = true }

[package.build]
backend = { name = "pixi-build-rust", workspace = true }
# sccache configuration for GitHub Actions. The values are pulled from the
# parent environment at build time and baked into the build script, so they
# only exist in CI. Local builds stay a plain cargo build.
#
# Due to a flaw in the pixi-build backends, the underlying `rattler-build`
# enforces build-environment isolation. This prevents the Rust toolchain
# from accessing build host's Cargo cache and the `CARGO_HOME` env var,
# resulting in a performance degradation where all crates must be
# re-downloaded during every build. Including CARGO_HOME in the secrets,
# which is not ideal, allows developers to work around this issue for
# local builds. Setting SCCACHE_DIR will also help when running local builds
# with sccache enabled.
secrets = [
  "ACTIONS_RESULTS_URL",
  "ACTIONS_RUNTIME_TOKEN",
  # "CARGO_HOME",
]

[package.build.config]
# sccache must use the GitHub Actions cache service v2; the legacy v1
# service is deprecated/blocked and rejects all cache writes.
#
# `SCCACHE_ENABLED` is a fake env var used to trigger sccache engagement in
# the pixi-build backend, as it has bug with detecting sccache correctly.
env = { ACTIONS_CACHE_SERVICE_V2 = "on", SCCACHE_ENABLED = "true" }

