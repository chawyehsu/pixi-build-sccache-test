[package]
name = "pixi-build-sccache-test"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.ci]
inherits = "release"
debug = false
strip = "none"
lto = false
codegen-units = 16

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"

[dependencies]
dirs-sys = "0.5.0"
windows-sys = { version = ">= 0.59.0", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
] }