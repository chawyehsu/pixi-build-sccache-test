name: Build

on:
  workflow_call:
    inputs:
      build_type:
        description: Build release or nightly artifacts
        required: false
        type: string
        default: nightly
  workflow_dispatch:
    inputs:
      build_type:
        description: Artifact type to build
        required: true
        type: choice
        options:
          - release
          - nightly
        default: nightly
      prestep:
        description: Pre-step to run before the build
        required: false
        type: choice
        options:
          - 'yes'
          - 'no'
        default: 'no'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, platform: windows }
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
      ACTIONS_CACHE_SERVICE_V2: on
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false

      # Without the following step, a sccache error occurs when building
      - name: Test
        if: github.event.inputs.prestep == 'yes'
        run: pixi run -e build cargo run
      
      # Windows: build
      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # Windows long-path issue workaround:
          New-Item -ItemType Junction -Path C:\w -Target "${{ github.workspace }}" | Out-Null
          cd C:\w

          mkdir out | Out-Null
          pixi run build --target-platform win-64
          if (0 -ne $LASTEXITCODE) {
            exit $LASTEXITCODE
          }
          mv *.conda out/windows.conda
          pixi run build --target-platform win-arm64
          if (0 -ne $LASTEXITCODE) {
            exit $LASTEXITCODE
          }
          mv *.conda out/windows-arm.conda

      - name: Check Sccache
        run: pixi run -e build cache-stat
